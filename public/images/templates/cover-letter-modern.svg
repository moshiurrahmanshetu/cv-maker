<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="100%">
  <!-- Background Paper -->
  <rect width="400" height="520" fill="#ffffff" rx="8" />
  <rect x="0.5" y="0.5" width="399" height="519" fill="none" stroke="#e2e8f0" stroke-width="1" rx="8" />

  <!-- Modern Letter Header (2-Sided) -->
  <rect x="30" y="26" width="130" height="14" rx="2" fill="#0f172a" />
  <rect x="30" y="44" width="90" height="6" rx="1.5" fill="#64748b" />

  <rect x="270" y="26" width="100" height="5" rx="1" fill="#475569" />
  <rect x="290" y="35" width="80" height="5" rx="1" fill="#475569" />
  <rect x="260" y="44" width="110" height="5" rx="1" fill="#475569" />
  <line x1="30" y1="62" x2="370" y2="62" stroke="#e2e8f0" stroke-width="1" />

  <!-- Modern Recipient Card with Left Accent Strip -->
  <rect x="30" y="76" width="340" height="42" rx="4" fill="#f8fafc" />
  <line x1="30" y1="76" x2="30" y2="118" stroke="#0f172a" stroke-width="3" />
  <rect x="42" y="82" width="110" height="7" rx="1" fill="#0f172a" />
  <rect x="42" y="93" width="90" height="5" rx="1" fill="#64748b" />
  <rect x="42" y="102" width="130" height="5" rx="1" fill="#94a3b8" />

  <!-- Subject Badge -->
  <rect x="30" y="130" width="150" height="16" rx="3" fill="#f1f5f9" />
  <rect x="40" y="135" width="130" height="6" rx="1" fill="#0f172a" />

  <!-- Salutation -->
  <rect x="30" y="158" width="100" height="7" rx="1" fill="#0f172a" />

  <!-- Paragraph 1 -->
  <rect x="30" y="174" width="340" height="5" rx="1" fill="#475569" />
  <rect x="30" y="182" width="340" height="5" rx="1" fill="#475569" />
  <rect x="30" y="190" width="300" height="5" rx="1" fill="#475569" />

  <!-- Paragraph 2 -->
  <rect x="30" y="206" width="340" height="5" rx="1" fill="#475569" />
  <rect x="30" y="214" width="340" height="5" rx="1" fill="#475569" />
  <rect x="30" y="222" width="320" height="5" rx="1" fill="#475569" />
  <rect x="30" y="230" width="240" height="5" rx="1" fill="#475569" />

  <!-- Paragraph 3 -->
  <rect x="30" y="246" width="340" height="5" rx="1" fill="#475569" />
  <rect x="30" y="254" width="280" height="5" rx="1" fill="#475569" />

  <!-- Sign-off -->
  <rect x="30" y="278" width="60" height="6" rx="1" fill="#64748b" />
  <rect x="30" y="300" width="90" height="8" rx="1" fill="#0f172a" />

  <!-- Modern Badge -->
  <rect x="280" y="475" width="90" height="22" rx="4" fill="#0284c7" />
  <text x="325" y="490" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">MODERN</text>
</svg>
