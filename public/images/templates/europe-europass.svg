<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="100%">
  <!-- Background Paper -->
  <rect width="400" height="520" fill="#ffffff" rx="8" />
  <rect x="0.5" y="0.5" width="399" height="519" fill="none" stroke="#e2e8f0" stroke-width="1" rx="8" />

  <!-- Europass Header with Avatar and Blue bar -->
  <rect x="30" y="24" width="48" height="48" rx="6" fill="#eff6ff" stroke="#0e4194" stroke-width="1.5" />
  <circle cx="54" cy="42" r="10" fill="#93c5fd" />
  <path d="M 40 64 Q 54 52 68 64" fill="#60a5fa" />

  <rect x="90" y="26" width="140" height="14" rx="2" fill="#0e4194" />
  <rect x="90" y="44" width="100" height="7" rx="1.5" fill="#4b5563" />
  <rect x="90" y="56" width="180" height="5" rx="1" fill="#9ca3af" />
  <line x1="30" y1="82" x2="370" y2="82" stroke="#0e4194" stroke-width="2" />

  <!-- Europass 2-Column Grid (Left Column: Labels, Right Column: Content) -->
  <!-- Summary -->
  <rect x="30" y="96" width="70" height="8" rx="1" fill="#0e4194" />
  <line x1="110" y1="94" x2="110" y2="130" stroke="#e5e7eb" stroke-width="1.5" />
  <rect x="120" y="96" width="250" height="5" rx="1" fill="#4b5563" />
  <rect x="120" y="105" width="230" height="5" rx="1" fill="#4b5563" />
  <rect x="120" y="114" width="210" height="5" rx="1" fill="#4b5563" />

  <!-- Experience -->
  <rect x="30" y="146" width="70" height="8" rx="1" fill="#0e4194" />
  <line x1="110" y1="140" x2="110" y2="240" stroke="#e5e7eb" stroke-width="1.5" />
  
  <rect x="120" y="146" width="60" height="10" rx="3" fill="#f3f4f6" />
  <rect x="120" y="160" width="140" height="7" rx="1" fill="#111827" />
  <rect x="120" y="170" width="110" height="5" rx="1" fill="#6b7280" />
  <rect x="120" y="178" width="250" height="4" rx="1" fill="#9ca3af" />
  <rect x="120" y="185" width="230" height="4" rx="1" fill="#9ca3af" />

  <rect x="120" y="198" width="60" height="10" rx="3" fill="#f3f4f6" />
  <rect x="120" y="212" width="130" height="7" rx="1" fill="#111827" />
  <rect x="120" y="222" width="100" height="5" rx="1" fill="#6b7280" />
  <rect x="120" y="230" width="240" height="4" rx="1" fill="#9ca3af" />

  <!-- Education -->
  <rect x="30" y="258" width="70" height="8" rx="1" fill="#0e4194" />
  <line x1="110" y1="252" x2="110" y2="310" stroke="#e5e7eb" stroke-width="1.5" />
  <rect x="120" y="258" width="60" height="10" rx="3" fill="#f3f4f6" />
  <rect x="120" y="272" width="150" height="7" rx="1" fill="#111827" />
  <rect x="120" y="282" width="120" height="5" rx="1" fill="#6b7280" />

  <!-- Languages (EU badges) -->
  <rect x="30" y="324" width="70" height="8" rx="1" fill="#0e4194" />
  <line x1="110" y1="318" x2="110" y2="360" stroke="#e5e7eb" stroke-width="1.5" />
  <rect x="120" y="324" width="80" height="14" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8" />
  <rect x="210" y="324" width="80" height="14" rx="3" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.8" />

  <!-- Europe Badge -->
  <rect x="270" y="475" width="100" height="22" rx="4" fill="#0e4194" />
  <text x="320" y="490" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">EUROPASS</text>
</svg>
