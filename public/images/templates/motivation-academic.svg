<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="100%">
  <!-- Background Paper -->
  <rect width="400" height="520" fill="#ffffff" rx="8" />
  <rect x="0.5" y="0.5" width="399" height="519" fill="none" stroke="#e2e8f0" stroke-width="1" rx="8" />

  <!-- Academic Burgundy Top Bar -->
  <rect x="24" y="24" width="352" height="4" fill="#8c1d40" />

  <!-- Sender details -->
  <rect x="24" y="36" width="140" height="12" rx="2" fill="#8c1d40" />
  <rect x="24" y="52" width="180" height="5" rx="1.5" fill="#64748b" />
  <rect x="310" y="36" width="66" height="6" rx="1" fill="#94a3b8" />

  <!-- Target Institution Box -->
  <rect x="24" y="72" width="352" height="38" rx="3" fill="#fdf2f4" />
  <line x1="24" y1="72" x2="24" y2="110" stroke="#8c1d40" stroke-width="3" />
  <rect x="36" y="78" width="130" height="7" rx="1" fill="#8c1d40" />
  <rect x="36" y="88" width="110" height="5" rx="1" fill="#475569" />
  <rect x="36" y="97" width="150" height="5" rx="1" fill="#64748b" />

  <!-- Centered Subject Statement -->
  <rect x="80" y="124" width="240" height="8" rx="1.5" fill="#8c1d40" />

  <!-- Salutation -->
  <rect x="24" y="146" width="160" height="7" rx="1" fill="#1e293b" />

  <!-- Motivation Paragraph 1 -->
  <rect x="24" y="162" width="352" height="5" rx="1" fill="#475569" />
  <rect x="24" y="170" width="352" height="5" rx="1" fill="#475569" />
  <rect x="24" y="178" width="352" height="5" rx="1" fill="#475569" />
  <rect x="24" y="186" width="290" height="5" rx="1" fill="#475569" />

  <!-- Motivation Paragraph 2 -->
  <rect x="24" y="202" width="352" height="5" rx="1" fill="#475569" />
  <rect x="24" y="210" width="352" height="5" rx="1" fill="#475569" />
  <rect x="24" y="218" width="352" height="5" rx="1" fill="#475569" />
  <rect x="24" y="226" width="310" height="5" rx="1" fill="#475569" />

  <!-- Goals Paragraph 3 -->
  <rect x="24" y="242" width="352" height="5" rx="1" fill="#475569" />
  <rect x="24" y="250" width="352" height="5" rx="1" fill="#475569" />
  <rect x="24" y="258" width="270" height="5" rx="1" fill="#475569" />

  <!-- Sign-off -->
  <rect x="24" y="280" width="80" height="6" rx="1" fill="#64748b" />
  <rect x="24" y="302" width="110" height="8" rx="1" fill="#8c1d40" />

  <!-- Academic Badge -->
  <rect x="260" y="475" width="110" height="22" rx="4" fill="#8c1d40" />
  <text x="315" y="490" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">MOTIVATION</text>
</svg>
